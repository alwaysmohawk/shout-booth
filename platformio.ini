; PlatformIO Project Configuration File - Shout Booth
; Two environments: controller (ESP32) and listener (ESP32-C3 + INMP441)

[platformio]
default_envs = controller, listener

[env:controller]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<controller/>
lib_deps = ayushsharma82/ElegantOTA @ ^3.1.0

[env:listener]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<listener/>
lib_deps = ayushsharma82/ElegantOTA @ ^3.1.0

[env:volume-tester]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<volume-tester/>
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
